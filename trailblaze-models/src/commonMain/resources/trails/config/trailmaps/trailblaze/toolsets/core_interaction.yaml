# Essential UI interaction tools for basic device control.
# Available on host-driven and on-device drivers only — Revyl has its own tool implementations.
#
# `tapOnPoint` (tap at x/y) is deliberately NOT here: the LLM taps by ref, and the framework
# computes the point. Offered beside `tap`, a model picks coordinates over refs and misses. A
# target that needs it opts in with `tools: [tapOnPoint]`. Recorded trails and scripted tools
# can call it either way; `trailblaze tool` and MCP clients only once the target opts in.
id: core_interaction
description: "Tap, swipe, type, and other basic device interactions."
always_enabled: true
drivers:
  - android-ondevice-accessibility
  - ios-host
  - ios-axe
tools:
  - clearText
  - eraseText
  - hideKeyboard
  - inputText
  - type
  - inputTextRandom
  - launchApp
  - openApp
  - networkConnection
  - openUrl
  - mobile_pasteClipboard
  - pressKey
  - scrollUntilTextIsVisible
  - mobile_setClipboard
  - sleep
  - swipe
  - takeSnapshot
  - tap
  - longPress
  - dragTo
  - wait
  - waitForChange
