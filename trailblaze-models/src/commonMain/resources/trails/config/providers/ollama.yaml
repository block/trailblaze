# Ollama built-in model definitions (local models, zero cost)
provider_id: ollama
name: Ollama
auth:
  required: false
models:
  # GPT-OSS models (no vision)
  - id: "gpt-oss:20b"
    vision: false
    context_length: 131072
    max_output_tokens: 65536
