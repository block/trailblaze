# Google built-in model definitions
# Models: https://ai.google.dev/gemini-api/docs/models
# Pricing: https://ai.google.dev/gemini-api/docs/pricing
provider_id: google
name: Google
auth:
  env_var: GOOGLE_API_KEY
default_model: gemini-3.6-flash
models:
  - id: gemini-3.6-flash
    context_length: 1048576
    max_output_tokens: 65536
    cost:
      input_per_million: 1.50
      output_per_million: 7.50
      cached_input_per_million: 0.15

  - id: gemini-3.5-flash
    context_length: 1048576
    max_output_tokens: 65536
    cost:
      input_per_million: 1.50
      output_per_million: 9.00
      cached_input_per_million: 0.15

  - id: gemini-3.5-flash-lite
    context_length: 1048576
    max_output_tokens: 65536
    cost:
      input_per_million: 0.30
      output_per_million: 2.50
      cached_input_per_million: 0.03

  - id: gemini-3.1-flash-lite
    context_length: 1048576
    max_output_tokens: 65536
    cost:
      input_per_million: 0.25
      output_per_million: 1.50
      cached_input_per_million: 0.025

  # Google prices this one by prompt size: the rates below are the <= 200K-token
  # tier. Prompts above 200K tokens bill at $4.00 / $18.00 / $0.40.
  - id: gemini-3.1-pro-preview
    context_length: 1048576
    max_output_tokens: 65536
    cost:
      input_per_million: 2.00
      output_per_million: 12.00
      cached_input_per_million: 0.20

  # Gemma 4 — open weights, served on the Gemini API at $0 on a rate-limited free tier.
  # Multimodal (text + image) with native function calling; 256K context on all three.
  # max_output_tokens is 32768 rather than the 65536 the Gemini models above use: Google
  # publishes no output cap for Gemma 4, and 32768 is the largest figure any host documents.
  - id: gemma-4-12b-it
    context_length: 262144
    max_output_tokens: 32768
    cost:
      input_per_million: 0.0
      output_per_million: 0.0
      cached_input_per_million: 0.0

  - id: gemma-4-26b-a4b-it
    context_length: 262144
    max_output_tokens: 32768
    cost:
      input_per_million: 0.0
      output_per_million: 0.0
      cached_input_per_million: 0.0

  - id: gemma-4-31b-it
    context_length: 262144
    max_output_tokens: 32768
    cost:
      input_per_million: 0.0
      output_per_million: 0.0
      cached_input_per_million: 0.0
