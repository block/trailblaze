# Anthropic built-in model definitions
# Pricing: https://platform.claude.com/docs/en/about-claude/pricing
# Models: https://platform.claude.com/docs/en/about-claude/models/all-models
# cached_input_per_million is a cache *hit*, billed at 10% of the base input rate.
provider_id: anthropic
name: Anthropic
auth:
  env_var: ANTHROPIC_API_KEY
default_model: claude-sonnet-5
models:
  - id: claude-fable-5
    context_length: 1000000
    max_output_tokens: 128000
    cost:
      input_per_million: 10.00
      output_per_million: 50.00
      cached_input_per_million: 1.00

  - id: claude-opus-5
    context_length: 1000000
    max_output_tokens: 128000
    cost:
      input_per_million: 5.00
      output_per_million: 25.00
      cached_input_per_million: 0.50

  # Standard rate. Introductory pricing of $2 / $10 per MTok applies through
  # August 31, 2026, so real spend on this model is lower until then.
  - id: claude-sonnet-5
    context_length: 1000000
    max_output_tokens: 128000
    cost:
      input_per_million: 3.00
      output_per_million: 15.00
      cached_input_per_million: 0.30

  - id: claude-haiku-4-5
    context_length: 200000
    max_output_tokens: 64000
    cost:
      input_per_million: 1.00
      output_per_million: 5.00
      cached_input_per_million: 0.10
