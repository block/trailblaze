config:
  devices:
    web:
      driver: PLAYWRIGHT_NATIVE
  title: 'Test: Search and click specific results with duplicate text'

trail:
  - step: "Navigate to ../../../examples/playwright-native/sample-app/search-duplicates.html"
    recording:
      web:
        - web_navigate:
            url: ../../../examples/playwright-native/sample-app/search-duplicates.html
            reasoning: The objective is to navigate to the specified URL. Since there are no interactive elements on the current screen, direct navigation using the target URL is the correct next step.

  - step: "Verify the heading \"Product Search\" is visible"
    recording:
      web:
        - web_verifyElementVisible:
            ref: e1
            reasoning: The current objective is to verify that the heading 'Product Search' is visible. The view hierarchy confirms that this heading is present as element [e1]. I will verify its visibility to satisfy the objective.
            nodeSelector:
              web:
                ariaRole: heading
                ariaNameRegex: Product Search

  - step: "Type \"Wireless Mouse\" into the search input field"
    recording:
      web:
        - web_type:
            text: Wireless Mouse
            ref: e2
            reasoning: The objective is to type 'Wireless Mouse' into the search input field. The element with ID e2 is labeled 'Search products' and is the appropriate textbox for this action.
            nodeSelector:
              web:
                cssSelector: "#search-input"

  - step: "Click the \"Search\" button"
    recording:
      web:
        - web_click:
            ref: e3
            reasoning: The objective is to click the 'Search' button. The view hierarchy shows a button labeled 'Search' with element ID e3, which is the clear target for this action.
            nodeSelector:
              web:
                cssSelector: "#search-btn"

  - step: "Verify the text \"4 results\" is visible"
    recording:
      web:
        - web_verifyElementVisible:
            nodeSelector:
              web:
                ariaRole: text
                ariaNameRegex: .*4 results.*

  - step: "Click the button labeled \"Wireless Mouse - Bluetooth, Black - $29.99\""
    recording:
      web:
        - web_click:
            ref: e5
            reasoning: The objective is to click the button labeled 'Wireless Mouse - Bluetooth, Black - $29.99'. In the view hierarchy, e5 is the list item with the matching label. Clicking this should fulfill the objective.
            nodeSelector:
              web:
                ariaRole: listitem
                ariaNameRegex: \QWireless Mouse - Bluetooth, Black - $29.99\E

  - step: "Verify the text \"Bluetooth, Black\" is visible in the detail section at the bottom"
    recording:
      web:
        - web_verifyElementVisible:
            nodeSelector:
              web:
                cssSelector: '#detail-subtitle:text-is("Bluetooth, Black")'

  - step: "Click the button labeled \"Wireless Mouse - Bluetooth, White - $29.99\""
    recording:
      web:
        - web_click:
            ref: e6
            reasoning: The objective requires clicking the button labeled 'Wireless Mouse - Bluetooth, White - $29.99'. The element with ID e6 matches this description, so clicking it will fulfill the objective.
            nodeSelector:
              web:
                ariaRole: listitem
                ariaNameRegex: \QWireless Mouse - Bluetooth, White - $29.99\E

  - step: "Verify the text \"Bluetooth, White\" is visible in the detail section at the bottom"
    recording:
      web:
        - web_verifyElementVisible:
            nodeSelector:
              web:
                cssSelector: '#detail-subtitle:text-is("Bluetooth, White")'
        - web_verifyElementVisible:
            nodeSelector:
              web:
                cssSelector: '#detail-subtitle:text-is("Bluetooth, White")'

  - step: "Click the button labeled \"Wireless Mouse - USB-A, Black - $19.99\""
    recording:
      web:
        - web_click:
            ref: e7
            reasoning: The objective is to click the button/list item labeled 'Wireless Mouse - USB-A, Black - $19.99'. The element [e7] matches this label exactly, so clicking it will complete the task.
            nodeSelector:
              web:
                ariaRole: listitem
                ariaNameRegex: \QWireless Mouse - USB-A, Black - $19.99\E

  - step: "Verify the text \"USB-A, Black\" is visible in the detail section at the bottom"
    recording:
      web:
        - web_verifyElementVisible:
            nodeSelector:
              web:
                cssSelector: '#detail-subtitle:text-is("USB-A, Black")'

  - step: "Click the button labeled \"Wireless Mouse - USB-C, Gray - $34.99\""
    recording:
      web:
        - web_click:
            ref: e8
            reasoning: Objective directs to click the button labeled 'Wireless Mouse - USB-C, Gray - $34.99'; 'e8' is the corresponding list item, which is likely clickable.
            nodeSelector:
              web:
                ariaRole: listitem
                ariaNameRegex: \QWireless Mouse - USB-C, Gray - $34.99\E

  - step: "Verify the text \"USB-C, Gray\" is visible in the detail section at the bottom"
    recording:
      web:
        - web_verifyElementVisible:
            nodeSelector:
              web:
                cssSelector: '#detail-subtitle:text-is("USB-C, Gray")'

  - step: "Clear the search input field and type \"Keyboard\""
    recording:
      web:
        - web_type:
            text: Keyboard
            ref: e2
            reasoning: The current objective is to clear the search input field and type 'Keyboard'. I will clear the textbox 'Search products' and enter the required text.
            nodeSelector:
              web:
                cssSelector: "#search-input"
        - web_type:
            text: Keyboard
            ref: e2
            reasoning: To fulfill the objective, I need to clear the search input field and type 'Keyboard'. I will clear the input first and then enter the required text.
            nodeSelector:
              web:
                cssSelector: "#search-input"

  - step: "Click the \"Search\" button"
    recording:
      web:
        - web_click:
            ref: e3
            reasoning: The current objective is to click the "Search" button. The button with element ID e3 matches this label. Clicking it should trigger the search action.
            nodeSelector:
              web:
                cssSelector: "#search-btn"

  - step: "Verify the text \"3 results\" is visible"
    recording:
      web:
        - web_verifyElementVisible:
            nodeSelector:
              web:
                ariaRole: text
                ariaNameRegex: .*3 results.*

  - step: "Click the button labeled \"Keyboard - Mechanical, Full-size - $89.99\""
    recording:
      web:
        - web_click:
            ref: e5
            reasoning: The list item [e5] matches the label 'Keyboard - Mechanical, Full-size - $89.99' from the objective. Clicking it will fulfill the objective to click this button or interactive target.
            nodeSelector:
              web:
                ariaRole: listitem
                ariaNameRegex: \QKeyboard - Mechanical, Full-size - $89.99\E

  - step: "Verify the text \"Mechanical, Full-size\" is visible in the detail section at the bottom"
    recording:
      web:
        - web_verifyElementVisible:
            nodeSelector:
              web:
                cssSelector: '#detail-subtitle:text-is("Mechanical, Full-size")'

  - step: "Click the button labeled \"Keyboard - Membrane, Compact - $39.99\""
    recording:
      web:
        - web_click:
            ref: e6
            reasoning: The objective is to click the button labeled 'Keyboard - Membrane, Compact - $39.99'. In this UI, product options are rendered as selectable list items. e6 matches the target label, so I will click it to fulfill the objective.
            nodeSelector:
              web:
                ariaRole: listitem
                ariaNameRegex: \QKeyboard - Membrane, Compact - $39.99\E

  - step: "Verify the text \"Membrane, Compact\" is visible in the detail section at the bottom"
    recording:
      web:
        - web_verifyElementVisible:
            nodeSelector:
              web:
                cssSelector: '#detail-subtitle:text-is("Membrane, Compact")'

  - step: "Click the button labeled \"Keyboard - Mechanical, Compact - $79.99\""
    recording:
      web:
        - web_click:
            ref: e7
            reasoning: The objective is to click the button labeled 'Keyboard - Mechanical, Compact - $79.99'. The corresponding listitem with this exact label is [e7], so I will click it to complete the action.
            nodeSelector:
              web:
                ariaRole: listitem
                ariaNameRegex: \QKeyboard - Mechanical, Compact - $79.99\E

  - step: "Verify the text \"Mechanical, Compact\" is visible in the detail section at the bottom"
    recording:
      web:
        - web_verifyElementVisible:
            nodeSelector:
              web:
                cssSelector: '#detail-subtitle:text-is("Mechanical, Compact")'
        - web_verifyElementVisible:
            nodeSelector:
              web:
                cssSelector: '#detail-subtitle:text-is("Mechanical, Compact")'

  - step: "Clear the search input field and type \"Monitor Stand\""
    recording:
      web:
        - web_type:
            text: Monitor Stand
            ref: e2
            reasoning: To complete the objective, I need to clear the current text in the search input and type 'Monitor Stand' in its place.
            nodeSelector:
              web:
                cssSelector: "#search-input"

  - step: "Click the \"Search\" button"
    recording:
      web:
        - web_click:
            ref: e3
            reasoning: The objective is to click the 'Search' button. The element [e3] is labeled as the 'Search' button, making it the correct target for this task. I expect this action to trigger the product search.
            nodeSelector:
              web:
                cssSelector: "#search-btn"

  - step: "Verify the text \"3 results\" is visible"
    recording:
      web:
        - web_verifyElementVisible:
            nodeSelector:
              web:
                ariaRole: text
                ariaNameRegex: .*3 results.*

  - step: "Click the button labeled \"Monitor Stand - Aluminum, Single - $49.99\""
    recording:
      web:
        - web_click:
            ref: e5
            reasoning: The objective is to click the button labeled 'Monitor Stand - Aluminum, Single - $49.99'. The list item e5 matches this label, and I expect that clicking it will execute the desired action or possibly reveal more product details.
            nodeSelector:
              web:
                ariaRole: listitem
                ariaNameRegex: \QMonitor Stand - Aluminum, Single - $49.99\E

  - step: "Verify the text \"Aluminum, Single\" is visible in the detail section at the bottom"
    recording:
      web:
        - web_verifyElementVisible:
            nodeSelector:
              web:
                cssSelector: '#detail-subtitle:text-is("Aluminum, Single")'

  - step: "Click the button labeled \"Monitor Stand - Aluminum, Dual - $79.99\""
    recording:
      web:
        - web_click:
            ref: e6
            reasoning: The objective clearly requests clicking the button labeled 'Monitor Stand - Aluminum, Dual - $79.99'. In the current view, this matches the list item with ID e6. I expect this action to select or show details for this product.
            nodeSelector:
              web:
                ariaRole: listitem
                ariaNameRegex: \QMonitor Stand - Aluminum, Dual - $79.99\E

  - step: "Verify the text \"Aluminum, Dual\" is visible in the detail section at the bottom"
    recording:
      web:
        - web_verifyElementVisible:
            nodeSelector:
              web:
                cssSelector: '#detail-subtitle:text-is("Aluminum, Dual")'

  - step: "Click the button labeled \"Monitor Stand - Wood, Single - $59.99\""
    recording:
      web:
        - web_click:
            ref: e7
            reasoning: The current objective is to click the button labeled 'Monitor Stand - Wood, Single - $59.99'. The element [e7] matches this label, so clicking it should fulfill the objective.
            nodeSelector:
              web:
                ariaRole: listitem
                ariaNameRegex: \QMonitor Stand - Wood, Single - $59.99\E

  - step: "Verify the text \"Wood, Single\" is visible in the detail section at the bottom"
    recording:
      web:
        - web_verifyElementVisible:
            nodeSelector:
              web:
                cssSelector: '#detail-subtitle:text-is("Wood, Single")'
