config:
  devices:
    web:
      driver: PLAYWRIGHT_NATIVE
  title: Yahoo Search for Trailblaze Block

trail:
  - step: "Open Yahoo.com"
    recording:
      web:
        - web_navigate:
            url: https://yahoo.com
            reasoning: The objective is to navigate to the provided file URL. There are currently no interactive elements, so navigation is the required step to begin this task.

  - step: "Input the search query of \"Trailblaze GitHub Block\" but don't click Search."
    recording:
      web:
        - web_type:
            text: Trailblaze GitHub Block
            reasoning: The Yahoo search box is already focused; I will enter the requested query without clicking the Search button.
            nodeSelector:
              web:
                ariaRole: searchbox
        - web_verifyValue:
            type: VALUE
            expected: Trailblaze GitHub Block
            reasoning: I will verify that the requested query is present in the search field and that it has not been submitted.
            nodeSelector:
              web:
                ariaRole: searchbox
