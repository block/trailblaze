config:
  devices:
    web:
      driver: PLAYWRIGHT_NATIVE
  title: 'Test: Click specific items in a list with duplicate text'

trail:
  - step: "Navigate to ../../../examples/playwright-native/sample-app/duplicate-list.html"
    recording:
      web:
        - web_navigate:
            url: ../../../examples/playwright-native/sample-app/duplicate-list.html
            reasoning: The objective is to navigate to the specified relative URL. Since there are no interactive elements or navigation options visible on the current page, I will directly navigate to the provided URL to begin or complete the task.

  - step: "Verify the heading \"Product List\" is visible"
    recording:
      web:
        - web_verifyElementVisible:
            ref: e1
            reasoning: The objective is to verify that the heading 'Product List' is visible, and element [e1] corresponds to that heading. This check confirms its presence on the screen.
            nodeSelector:
              web:
                ariaRole: heading
                ariaNameRegex: Product List

  - step: "Click the \"View\" button on the first \"Premium Cable\" item in the Electronics section"
    recording:
      web:
        - web_click:
            ref: e4
            reasoning: This is the first 'View' button in the Electronics section, which corresponds to the first 'Premium Cable' item as per the objective.
            nodeSelector:
              index: 2

  - step: "Verify the text \"elec-1\" is visible in the detail panel"
    recording:
      web:
        - web_verifyElementVisible:
            nodeSelector:
              web:
                ariaRole: text
                ariaNameRegex: .*elec-1.*

  - step: "Click the \"View\" button on the second \"Premium Cable\" item in the Electronics section"
    recording:
      web:
        - web_click:
            ref: e5
            reasoning: This is the second 'View' button under the Electronics section, which matches the request to click the 'View' button for the second 'Premium Cable' item in that section.
            nodeSelector:
              web:
                ariaRole: button
                ariaNameRegex: View
                nthIndex: 1

  - step: "Verify the text \"elec-2\" is visible in the detail panel"
    recording:
      web:
        - web_verifyElementVisible:
            nodeSelector:
              web:
                ariaRole: text
                ariaNameRegex: .*elec-2.*

  - step: "Click the \"View\" button on the \"Standard Adapter\" item in the Electronics section"
    recording:
      web:
        - web_click:
            ref: e6
            reasoning: This is the third 'View' button under the Electronics section, corresponding to the 'Standard Adapter' item, as per the layout and visual structure.
            nodeSelector:
              web:
                ariaRole: button
                ariaNameRegex: View
                nthIndex: 2

  - step: "Verify the text \"elec-3\" is visible in the detail panel"
    recording:
      web:
        - web_verifyElementVisible:
            nodeSelector:
              web:
                ariaRole: text
                ariaNameRegex: .*elec-3.*

  - step: "Click the \"View\" button on the \"Premium Cable\" item in the Office Supplies section"
    recording:
      web:
        - web_click:
            ref: e8
            reasoning: This is the first 'View' button under the 'Office Supplies' heading, matching the expected position for 'Premium Cable' in this section.
            nodeSelector:
              web:
                ariaRole: button
                ariaNameRegex: View
                nthIndex: 3

  - step: "Verify the text \"office-1\" is visible in the detail panel"
    recording:
      web:
        - web_verifyElementVisible:
            nodeSelector:
              web:
                ariaRole: text
                ariaNameRegex: .*office-1.*

  - step: "Click the \"View\" button on the first \"Standard Adapter\" item in the Office Supplies section"
    recording:
      web:
        - web_click:
            ref: e9
            reasoning: Based on the hierarchy, [e9] is the second View button after the Office Supplies heading and represents the first Standard Adapter in that section. Clicking it fulfills the objective.
            nodeSelector:
              web:
                ariaRole: button
                ariaNameRegex: View
                nthIndex: 4

  - step: "Verify the text \"office-2\" is visible in the detail panel"
    recording:
      web:
        - web_verifyElementVisible:
            nodeSelector:
              web:
                ariaRole: text
                ariaNameRegex: .*office-2.*

  - step: "Click the \"View\" button on the second \"Standard Adapter\" item in the Office Supplies section"
    recording:
      web:
        - web_click:
            ref: e10
            reasoning: Based on the hierarchy, e10 is the 'View' button corresponding to the second 'Standard Adapter' item in the 'Office Supplies' section. Clicking this fulfills the objective.
            nodeSelector:
              web:
                ariaRole: button
                ariaNameRegex: View
                nthIndex: 5

  - step: "Verify the text \"office-3\" is visible in the detail panel"
    recording:
      web:
        - web_verifyElementVisible:
            nodeSelector:
              web:
                ariaRole: text
                ariaNameRegex: .*office-3.*

  - step: "Click the \"View\" button on the first \"Premium Cable\" item in the Accessories section"
    recording:
      web:
        - web_scroll:
            amount: 400
            reasoning: The Accessories section 'View' buttons are currently offscreen. Scrolling down will bring them into view so I can interact with the first 'View' button under Accessories.
        - web_click:
            ref: e12
            reasoning: The Accessories section's first Premium Cable corresponds to the first "View" button after the Accessories heading ([e12]). Clicking this will fulfill the objective as specified.
            nodeSelector:
              web:
                ariaRole: button
                ariaNameRegex: View
                nthIndex: 6

  - step: "Verify the text \"acc-1\" is visible in the detail panel"
    recording:
      web:
        - web_verifyElementVisible:
            nodeSelector:
              web:
                ariaRole: text
                ariaNameRegex: .*acc-1.*

  - step: "Click the \"View\" button on the second \"Premium Cable\" item in the Accessories section"
    recording:
      web:
        - web_click:
            ref: e13
            reasoning: Objective requires clicking the View button for the second Premium Cable in Accessories; based on element order, [e13] is the correct target.
            nodeSelector:
              web:
                ariaRole: button
                ariaNameRegex: View
                nthIndex: 7

  - step: "Verify the text \"acc-2\" is visible in the detail panel"
    recording:
      web:
        - web_verifyElementVisible:
            nodeSelector:
              web:
                ariaRole: text
                ariaNameRegex: .*acc-2.*
