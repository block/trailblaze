<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trail Runner</title>
<link rel="icon" type="image/png" href="./favicon.png" />
<script>
  (function () {
    try {
      var m = JSON.parse(localStorage.getItem('tb-theme')) || 'system';
      var prefersLight = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches;
      var dark = m === 'dark' || (m === 'system' && !prefersLight);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
  })();
</script>
<link rel="stylesheet" href="./styles/trailrunner.css" />
<link rel="stylesheet" href="./app/app.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.js"></script>
<link rel="stylesheet" href="https://unpkg.com/@highlightjs/cdn-assets@11.9.0/styles/github-dark.min.css" />
<script src="https://unpkg.com/@highlightjs/cdn-assets@11.9.0/highlight.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/codemirror@5.65.16/lib/codemirror.css" />
<link rel="stylesheet" href="https://unpkg.com/codemirror@5.65.16/addon/lint/lint.css" />
<script src="https://unpkg.com/codemirror@5.65.16/lib/codemirror.js"></script>
<script src="https://unpkg.com/codemirror@5.65.16/mode/yaml/yaml.js"></script>
<script src="https://unpkg.com/codemirror@5.65.16/mode/clike/clike.js"></script>
<script src="https://unpkg.com/codemirror@5.65.16/mode/javascript/javascript.js"></script>
<script src="https://unpkg.com/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<script src="https://unpkg.com/codemirror@5.65.16/addon/lint/lint.js"></script>
<script src="https://unpkg.com/codemirror@5.65.16/addon/lint/yaml-lint.js"></script>
</head>
<body>
<div id="root"></div>
<!-- Typed daemon-RPC client (generated bindings, bundled by `bun build app/rpc/daemon.ts`).
     Loaded before the screens so `window.TbRpc` is published before any data hook runs. -->
<script src="./app/rpc/daemon.bundle.js"></script>
<!-- Shared run-report renderer + log→timeline extraction (plain JS, no JSX). Loaded as a classic
     script BEFORE the screens so extractTrace/extractLlmLogs/buildRunReportHtml are globals
     that run-payload.js and the Share button use. The same module is require()'d by the bun CLI report
     generator, and by the report document the app embeds in a run's details. -->
<script src="./app/run-report-core.js"></script>
<!-- Monaco + LSP client for the scripted-tool (.ts) + tool-definition (.tool.yaml) editors. Plain JS
     (no JSX/bundler): lazy-loads Monaco from the CDN on first use and publishes `window.TBMonaco`.
     Loaded before the screens so tools.tsx can feature-detect it; if it's absent or fails, the
     editor falls back to CodeMirror. lsp-convert.js (shared, unit-tested conversions) loads first. -->
<script src="./app/editor/lsp-convert.js"></script>
<script src="./app/editor/monaco-lsp.js"></script>
<!-- Pure trail step-matrix model (window.TM): normalizes both the unified single-file format and
     legacy per-platform folders into one shape. Plain JS (no JSX/bundler), unit-tested in
     app/screens/trail-model.test.ts; loaded before the screens so trail-detail.tsx sees it. -->
<script src="./app/screens/trail-model.js"></script>
<!-- Pure History grouping model: local day → logical device leg with status summaries. -->
<script src="./app/screens/session-history-model.js"></script>
<!-- Decides which run the Active screen follows after a launch: the id dispatch reported, or the
     newest running row when no id is coming. Plain JS with a sibling bun test. -->
<script src="./app/screens/follow-run-model.js"></script>
<!-- Unified trail/blaze YAML producers (config: + trail:, per-step recording keyed by device
     classifier). Single source of truth shared with the recorder screens (thin delegating wrappers)
     and bun tests in app/trail-yaml.test.ts. Plain JS; loaded before the screens. -->
<script src="./app/trail-yaml.js"></script>
<!-- Pure target/device grouping model. Browser devices join declared web targets here rather than
     being flattened into an anonymous Web bucket by the React screen. -->
<script src="./app/screens/target-picker-model.js"></script>
<!-- Groups the declared-but-absent targets (TrailmapsResponse.notInstalledTargets) by home repo for
     the Trailmaps screens' "lives in another repo" section. Plain JS with a sibling bun test. -->
<script src="./app/screens/not-installed-targets-model.js"></script>
<!-- Generic extension workspace navigation: downstream integrations opt into the primary rail by
     supplying a same-origin action href. The shell mounts those sub-apps inside its content pane;
     labels, assets, APIs, and implementation stay downstream-owned. -->
<script src="./app/workspace-navigation.js"></script>
<!-- Live device mirror transport (H.264/CDP live stream with layered JPEG/poll fallback), shared by
     the recorder + companion mirror. Plain JS with a sibling live-device-stream.test.ts; loaded
     before the screens so they see window.TbLiveDeviceStream. -->
<script src="./app/live-device-stream.js"></script>
<!-- Session-zip → run-report assembly (window.TbZipReport): ZIP reader + the LogsRepo/SessionInfo
     read-slice ports that turn a downloaded session archive into buildRunReportHtml inputs. Plain
     JS with a sibling zip-report-core.test.ts; loaded before the screens so the zip-report
     screen sees it. Served from :trailblaze-report's resources at this same classpath path (like
     run-report-core.js), because the report viewer shell inlines it at transpile time — one copy of
     the pipeline, whichever home loads it. -->
<script src="./app/zip-report-core.js"></script>
<!-- Run-report payload assembly from live daemon data (window.TbRunPayload): screenshots either
     embedded as data URIs (the Share button's portable export) or linked to /static/ (the
     daemon-served report-live.html document). Plain JS with a sibling run-payload.test.ts; loaded
     after run-report-core.js (whose extractors it reads) and before the screens. -->
<script src="./app/run-payload.js"></script>
<!-- Device selection + multi-device launch for the Run trail dialog (window.TbRunFanout): which
     devices a freshly opened dialog starts with, and the per-device connect/dispatch fan-out that
     runs a trail once on each checked device. Plain JS with a sibling run-fanout.test.ts; loaded
     before the screens so runconfig.tsx sees it. -->
<script src="./app/run-fanout.js"></script>
<!-- What the trail editor does when the file it has open changes on disk (window.TbEditorSync):
     follow it, or report a conflict rather than overwrite unsaved edits. Plain JS with a sibling
     editor-sync.test.ts; loaded before the screens so editor.tsx sees it. -->
<script src="./app/editor-sync.js"></script>
<!-- The screens. Authored as .tsx (see app/), transpiled 1:1 to these .js artifacts at build
     time by :trailblaze-host:transpileTrailRunnerApp — no bundling and no renaming, because these
     are classic scripts that share one global scope and read each other by bare name. The order
     below IS the dependency order: a screen must come after every global it reads. Adding a screen
     means adding both the .tsx and its <script> tag here; the build fails if they disagree. -->
<script src="./app/ui.js"></script>
<script src="./app/data-core.js"></script>
<script src="./app/data-hooks.js"></script>
<script src="./app/data-extract.js"></script>
<script src="./app/editor.js"></script>
<script src="./app/screens/home.js"></script>
<script src="./app/screens/settings.js"></script>
<script src="./app/screens/devices.js"></script>
<script src="./app/screens/integrations.js"></script>
<script src="./app/screens/blaze.js"></script>
<script src="./app/screens/record.js"></script>
<script src="./app/screens/steps-board.js"></script>
<script src="./app/screens/trail-tree.js"></script>
<script src="./app/screens/trail-detail.js"></script>
<script src="./app/screens/trails.js"></script>
<script src="./app/screens/tools.js"></script>
<script src="./app/screens/trailmaps.js"></script>
<script src="./app/screens/demonstrate.js"></script>
<script src="./app/screens/external-agents.js"></script>
<script src="./app/screens/companion.js"></script>
<script src="./app/screens/agent-setup.js"></script>
<script src="./app/share-export.js"></script>
<script src="./app/screens/zip-report.js"></script>
<script src="./app/screens/trace-viewer.js"></script>
<script src="./app/screens/sessions.js"></script>
<script src="./app/runcommand.js"></script>
<script src="./app/runconfig-steps.js"></script>
<script src="./app/runconfig.js"></script>
<script src="./app/shell.js"></script>
</body>
</html>
