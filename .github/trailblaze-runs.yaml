# What pr-checks.yml runs through the trail runner (trail-runner.yml): the showcase trails, one per
# platform, and the examples module's on-device Clock test. The request format is in
# docs/github-actions.md.
defaults:
  mode: replay
  # Scripted tools in a source checkout need the TypeScript SDK's esbuild.
  setup: cd sdks/typescript && bun install --frozen-lockfile
runs:
  - name: android-clock
    device: android
    android: { api: 34, profile: Nexus 6 }
    trails: [trails/clock/set-alarm-730am/trail.yaml]

  # The examples module's instrumentation test APK (from pr-checks.yml's build job), run as a
  # device farm runs one. The trail runs inside the test on the device.
  - name: android-clock-on-device
    device: android
    android: { api: 34, profile: Nexus 6 }
    test-apk: examples-debug-androidTest.apk
    test-targets: [class xyz.block.trailblaze.examples.clock.ClockTest]
    # Replays recordings, so no LLM is called; the client wiring needs a non-empty token.
    test-args: { trailblaze.llm.auth.token.openai: no-key-set }
    setup: ""

  - name: web-wikipedia
    device: web
    config-dir: examples/wikipedia/trails/config
    trails: [trails/wikipedia/test-article-shakespeare/trail.yaml]
    # Record the browser's traffic so the report shows the Network tab.
    args: --capture-network

  - name: ios-contacts
    device: ios
    ios: { simulator: iPhone 17 Pro }
    config-dir: examples/ios-contacts/trails/config
    # The recording starts on the Contacts list.
    setup: >-
      (cd sdks/typescript && bun install --frozen-lockfile)
      && xcrun simctl launch booted com.apple.MobileAddressBook && sleep 5
    trails: [trails/ios-contacts/test-create-then-delete/trail.yaml]
