name: release

on:
  push:
    tags:
      # Release tags only. `**` also matched throwaway tags (`backup/…`), which would have run a
      # publish at the SNAPSHOT version from `gradle.properties` — a Maven Central release happens
      # when, and only when, a `vYYYY.MM.DD` release tag is pushed.
      - 'v*'

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false -Dkotlin.incremental=false"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Bun
        # `-Ptrailblaze.wasm=true` packages `:trailblaze-models`' JAR resources,
        # which runs `:trailblaze-models:bundleTrailblazeSdkDts` to roll up the
        # `@trailblaze/scripting` declaration bundle. That task `bun install`s the
        # SDK devDependencies and shells out to esbuild/dts-bundle-generator, so
        # bun is a hard build prerequisite — without it on PATH the build fails.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Generate WASM Report Template
        run: ./gradlew :trailblaze-report:generateReportTemplate -Ptrailblaze.wasm=true

      - name: Publish Artifacts
        # The release coordinate comes from the tag, passed explicitly instead of relying on
        # `gradle/git-version.gradle.kts`'s git-describe fallback. `-Pversion` is the one input
        # that reaches BOTH this build and the composite-included `trailblaze-android-gradle`
        # build, so the Gradle plugin ships under the same version as the libraries rather than
        # re-publishing the SNAPSHOT default from its own `gradle.properties`.
        run: ./gradlew publishAllPublicationsToMavenCentralRepository -Pversion="${GITHUB_REF_NAME#v}" -Ptrailblaze.wasm=true
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SECRET_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SECRET_PASSPHRASE }}
