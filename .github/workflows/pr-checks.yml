name: Checks

on:
  # Runs on PRs targeting the default branch
  pull_request:
    branches: [ "main" ]

  # Runs after merging to the default branch
  push:
    branches: [ "main" ]

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pre-build the trailblaze uber JAR once and publish it as an artifact for
  # the downstream test jobs to consume. Mirrors the trailblaze-internal `build-uber-jar` Buildkite step:
  # downstream test jobs install the prebuilt JAR via
  # `scripts/install-trailblaze-from-artifact.sh` instead of paying their own
  # `./gradlew :trailblaze-desktop:jar` (~3–5 min cold) plus a cold daemon
  # start via `./gradlew :trailblaze-desktop:run`. The installed `trailblaze`
  # binary runs the JAR directly via `java -jar`, skipping Gradle entirely
  # for every CLI invocation.
  build-uber-jar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Gradle
        # Persists the Gradle User Home (dependency cache + local build cache)
        # across runs. Pushes to main seed the cache; PR runs restore it
        # read-only, so warm PR builds pull unchanged task outputs from cache.
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Setup Android SDK
        # trailblaze-desktop transitively depends on Android-targeted modules,
        # so the Android Gradle Plugin needs an SDK to evaluate the build.
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          # Drop the action's default `tools` package. Google removed the obsolete SDK Tools
          # package from the repository, so `sdkmanager tools` fails outright on runner images
          # that no longer ship it preinstalled. `platform-tools` is what the build needs.
          packages: platform-tools

      - name: Setup Bun
        # `:trailblaze-desktop:releaseArtifacts` transitively triggers
        # `:trailblaze-scripting-subprocess:installTrailblazeScriptingSdk`,
        # which runs `bun install` to lay down the scripting SDK's
        # node_modules ahead of JAR packaging.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Build trailblaze uber JAR
        # `install-trailblaze-source.sh` invokes
        # `:trailblaze-desktop:releaseArtifacts`, which runs
        # `packageUberJarForCurrentOS` and copies the launcher script
        # alongside the JAR into `trailblaze-desktop/build/release/`.
        # TRAILBLAZE_GRADLE_EXTRA_ARGS layers in `--parallel` so independent
        # modules compile concurrently (the
        # `checks` job already runs the same task graph with `--parallel`).
        env:
          TRAILBLAZE_GRADLE_EXTRA_ARGS: --parallel
        run: ./scripts/install-trailblaze-source.sh

      - name: Stage artifact contents
        # `releaseArtifacts` lays down the JAR + launcher with stable names
        # at `trailblaze-desktop/build/release/`. Copy them to a flat
        # top-level staging dir so the upload step keeps the layout simple
        # — `actions/download-artifact@v4` extracts into a directory whose
        # contents match what was uploaded, and the install-from-artifact
        # script expects `trailblaze.jar` + `trailblaze` side-by-side.
        run: |
          mkdir -p trailblaze-uber-jar
          cp trailblaze-desktop/build/release/trailblaze.jar trailblaze-uber-jar/
          cp trailblaze-desktop/build/release/trailblaze trailblaze-uber-jar/
          ls -lh trailblaze-uber-jar/

      - name: Upload uber JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: trailblaze-uber-jar
          path: trailblaze-uber-jar/
          if-no-files-found: error
          retention-days: 7

  # Run Tests. Split into two parallel jobs so the slow
  # `:trailblaze-scripting-subprocess` test suite (~45min — spawns a `bun`/`tsx`
  # subprocess per test) doesn't gate the rest of the build behind a single
  # 60-minute timeout. Wall-clock time becomes max(jobs), not sum.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          check-latest: true

      - name: Setup Gradle
        # Dependency + build cache reuse across runs (seeded on main pushes,
        # restored read-only on PRs) — unchanged modules restore compiled
        # classes and test results metadata from cache instead of rebuilding.
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Setup Bun
        # bun is the sole supported JS runtime. `assemble check` triggers
        # `:trailblaze-scripting-subprocess:installTrailblazeScriptingSdk`
        # (a `bun install` that downstream JAR builds read) and the host
        # `CheckCommandTest` suite, which shells out to the bun-test phase.
        # Without bun on PATH both fail hard rather than skipping.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install ffmpeg
        # The trailblaze-capture video tests encode real recordings; see the script for
        # why it is a pinned build.
        run: ./.github/install-ffmpeg.sh

      - name: Test on Ubuntu (excluding scripting-subprocess)
        # `--parallel` lets independent modules compile and test concurrently
        # across the daemon's worker pool; combined with carving out the slow
        # subprocess suite into its own job this brings the wall-clock down
        # from 60+ minutes to roughly 10–15.
        run: >-
          ./gradlew --parallel assemble check
          -x :trailblaze-scripting-subprocess:test
          -x :trailblaze-scripting-subprocess:check

      - name: Verify Documentation is up-to-date
        run: ./scripts/generate-docs-and-diff.sh

  # Isolated job for the subprocess-spawning tests. Each test forks a
  # `bun`/`tsx` child process to exercise the MCP transport, so the suite
  # is i/o-bound and serializes inside a single JVM — running it in its own
  # CI job lets the faster `checks` job report status promptly even when
  # this one is still working through its subprocess fan-out.
  checks-scripting-subprocess:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          check-latest: true

      - name: Setup Gradle
        # Dependency + build cache reuse across runs (seeded on main pushes,
        # restored read-only on PRs).
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Setup Bun
        # The subprocess tests `bun install` and then spawn `bun`/`tsx` for each
        # MCP server fixture. The other Android jobs already set this up; the
        # checks job didn't need it before, but this isolated suite does.
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Run scripting-subprocess tests
        run: ./gradlew :trailblaze-scripting-subprocess:check

  # The examples module's instrumentation test APK, for the trail runner's on-device run.
  build-examples-test-apk:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Build the test APK
        run: ./gradlew --parallel :examples:assembleDebugAndroidTest

      - name: Upload the test APK
        uses: actions/upload-artifact@v4
        with:
          name: examples-test-apk
          path: examples/build/outputs/apk/androidTest/debug/examples-debug-androidTest.apk
          if-no-files-found: error

  # Every PR's showcase trails, plus the examples module's on-device Clock test, run through the
  # public trail runner (trail-runner.yml + actions/trailblaze/) with the CLI this PR built. It
  # dogfoods the runner that other repos call, so a change that breaks it fails here first. The
  # main-only Clock, Wikipedia and iOS Contacts workflows still produce the docs gallery.
  trail-runner:
    if: github.event_name == 'pull_request'
    needs: [build-uber-jar, build-examples-test-apk]
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/trail-runner.yml
    with:
      request: .github/trailblaze-runs.yaml
      cli-artifact: trailblaze-uber-jar
      app-artifact: examples-test-apk

  # Drives a first-class TrailblazeTool over the daemon's `POST /mcp` endpoint —
  # the surface an external MCP client (Claude Code, Codex, Goose) uses. This is
  # the only job that reaches `TrailblazeMcpBridgeImpl.executeToolViaRpc` with
  # the interface's `blocking = false` default: trail-runner's on-device run is pure
  # instrumentation, and its `trailblaze run` runs go through DesktopYamlRunner.
  # Asserts an on-device failure surfaces as `isError` and a success returns the
  # tool's own output rather than an outcome-free placeholder.
  android-tests-mcp-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: build-uber-jar
    env:
      # Tools are dispatched by name — the inner agent (and therefore the LLM) is
      # never invoked.
      OPENAI_API_KEY: no-key-set
      # Record each session's screen so the report plays the recording (off by default).
      TRAILBLAZE_CAPTURE_VIDEO: "true"

    steps:
      - name: Enable KVM group perms
        if: runner.os == 'Linux'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls /dev/kvm

      - name: Keep the daemon's ports out of the ephemeral range
        # 52525/52526 fall inside Linux's ephemeral range (32768-60999), and the emulator and its
        # helpers bind random ports from it. One landing on 52525 first makes the daemon exit with
        # "Address already in use". Reserving them keeps the kernel from handing them out.
        if: runner.os == 'Linux'
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=52525-52526

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          # Drop the action's default `tools` package. Google removed the obsolete SDK Tools
          # package from the repository, so `sdkmanager tools` fails outright on runner images
          # that no longer ship it preinstalled. `platform-tools` is what the build needs.
          packages: platform-tools

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Download prebuilt uber JAR
        uses: actions/download-artifact@v4
        with:
          name: trailblaze-uber-jar
          path: trailblaze-uber-jar/

      - name: Install trailblaze from prebuilt artifact
        env:
          TRAILBLAZE_ARTIFACT_DIR: ${{ github.workspace }}/trailblaze-uber-jar
        run: ./scripts/install-trailblaze-from-artifact.sh

      - name: Install ffmpeg
        # Session video encodes through it; see the script for why it is a pinned build.
        run: ./.github/install-ffmpeg.sh

      - name: Create and start emulator and run MCP dispatch check (Linux)
        if: runner.os == 'Linux'
        uses: reactivecircus/android-emulator-runner@b530d96654c385303d652368551fb075bc2f0b6b
        id: run-tests-linux
        continue-on-error: true
        with:
          api-level: 34
          arch: x86_64
          disable-animations: true
          disk-size: 6000M
          heap-size: 600M
          profile: Nexus 6
          script: ./.github/pr_run_android_mcp_dispatch.sh

      - name: Create artifacts
        if: always()
        continue-on-error: true
        run: ./.github/pr_create_artifacts.sh

      - name: Upload artifacts
        if: always()  # Ensures this runs even if the previous step failed
        uses: actions/upload-artifact@v4
        with:
          name: trailblaze-artifacts-mcp-dispatch
          path: |
            trailblaze-logs.zip
            logcat.log
            mcp-dispatch/

      - name: Fail if the MCP dispatch check failed
        if: steps.run-tests-linux.outcome == 'failure'
        run: |
          echo "MCP dispatch check failed - failing the workflow"
          exit 1
